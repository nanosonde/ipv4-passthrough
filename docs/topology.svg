<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1050 350" width="1050" height="350" font-family="sans-serif" font-size="14">
  <title>ipv4-passthrough topology</title>
  <rect width="1050" height="350" fill="#ffffff"/>

  <!-- cables -->
  <g stroke="#333" stroke-width="2" fill="none">
    <line x1="150" y1="135" x2="350" y2="135"/>
    <line x1="510" y1="135" x2="710" y2="135"/>
    <line x1="860" y1="135" x2="930" y2="135"/>
  </g>
  <path d="M785 260 V320 H430 V250" stroke="#c0392b" stroke-width="2" stroke-dasharray="7 5" fill="none"/>

  <!-- FritzBox -->
  <rect x="20" y="95" width="130" height="80" rx="8" fill="#e8f1fb" stroke="#2c5d94" stroke-width="2"/>
  <text x="85" y="130" text-anchor="middle" font-weight="bold">FritzBox</text>
  <text x="85" y="150" text-anchor="middle" font-size="12">main router</text>

  <!-- this device -->
  <rect x="280" y="50" width="300" height="200" rx="8" fill="#eaf6ea" stroke="#2e7d32" stroke-width="2"/>
  <text x="430" y="75" text-anchor="middle" font-weight="bold">this device (OpenWrt)</text>
  <rect x="350" y="95" width="160" height="80" rx="6" fill="#ffffff" stroke="#2e7d32" stroke-width="1.5"/>
  <text x="430" y="120" text-anchor="middle" font-weight="bold">br-ip4pt</text>
  <text x="430" y="138" text-anchor="middle" font-size="12">bridge: MAC rewrite (nft)</text>
  <text x="430" y="154" text-anchor="middle" font-size="12">+ ARP replies (ebtables)</text>
  <text x="287" y="128" font-size="13">eth0</text>
  <text x="573" y="128" font-size="13" text-anchor="end">eth1</text>
  <text x="440" y="235" font-size="13">eth2</text>
  <text x="430" y="212" text-anchor="middle" font-size="12" fill="#555">listens only, never forwards</text>

  <!-- Router2 -->
  <rect x="710" y="50" width="150" height="210" rx="8" fill="#fdf3e3" stroke="#b9770e" stroke-width="2"/>
  <text x="785" y="80" text-anchor="middle" font-weight="bold">Router2</text>
  <text x="785" y="98" text-anchor="middle" font-size="12">second router, no NAT</text>
  <text x="716" y="128" font-size="13">WAN</text>
  <text x="854" y="128" font-size="13" text-anchor="end">LAN</text>
  <text x="785" y="225" text-anchor="middle" font-size="12">mirror port</text>

  <!-- clients -->
  <rect x="930" y="95" width="100" height="80" rx="8" fill="#f3e8fa" stroke="#7b3fa0" stroke-width="2"/>
  <text x="980" y="130" text-anchor="middle" font-weight="bold">Clients</text>
  <text x="980" y="150" text-anchor="middle" font-size="12">behind Router2</text>

  <!-- mirror label -->
  <text x="607" y="311" text-anchor="middle" font-size="12" fill="#c0392b">mirror of Router2's LAN port (ingress + egress) - discovery only</text>
</svg>
