# /etc/ip4pt/ip4pt.conf  -- all site-specific settings for ipv4-passthrough.

UPLINK=eth0            # bridge port towards FritzBox
DOWNLINK=eth1          # bridge port towards Router2 WAN
DISCOVER_IF=eth2       # free port on Router2, configured to mirror its
                        # main LAN port (ingress + egress) -- discovery only

# Persisted under /etc (survives reboots, and sysupgrade via the package's
# keep.d drop-in).
STATE_DIR=/etc/ip4pt/state
STALE_SECS=2592000     # 30 days -- churn is expected to be rare; raise
                        # further or drop GC entirely if it's never useful

# Second lifecycle tier, checked BEFORE STALE_SECS: once a host has been
# silent on the mirror for this long, ip4pt stops ANSWERING ARP for it (the
# arpreply rule is dropped; binding + nft map element stay). The FritzBox's
# own probes then go unanswered and it flips the host to "offline" on its
# own -- typically within minutes -- so an offline Router2 client also
# shows offline in the FritzBox's network overview. The first ARP seen from
# the host on the mirror restores the rule and it is online again within
# a second. Set to 0 to disable (silent hosts then stay online until the
# full STALE_SECS removal).
# Must stay well below STALE_SECS; tuned for the ARP cadence of your
# clients (phones idle for a night easily exceed 15 min without ARP).
OFFLINE_SECS=900      # 15 minutes
# GC_INTERVAL=60        # poll cadence in seconds; lower it only for tests

# Router2's real WAN-facing MAC (get once via `bridge fdb show dev eth1`
# after some traffic has flowed). This is the only place it's set -- run
# `ip4pt-gen-nft` after changing it to regenerate the nftables rule that
# also needs this value.
#
# UPLINK/DOWNLINK above are likewise the only place those names are set:
# ip4pt-gen-nft substitutes them (and ROUTER2_MAC) into
# /usr/lib/ip4pt/10-ip4pt.nft.tmpl, so the rendered ruleset can never drift
# from here (NFR-6).
ROUTER2_MAC=aa:bb:cc:dd:ee:ff
